<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>blog post</title>
</head>

<body>
    {% for posts in blog_posts: %}
        {% if posts['id'] == 2 %}
            <h1>{{posts['title']}}</h1>
            <h2>{{posts['subtitle']}}</h2>
        {% endif %}
    {% endfor %}
</body>
</html>
